<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Eco-Island Model with Waves</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #4CAF50; }
        p { margin: 0; font-size: 12px; color: #ddd; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h1>Eco-Island 3D Model</h1>
        <p>Orbit: Left Click + Drag | Pan: Right Click + Drag | Zoom: Scroll</p>
    </div>

    <script>
        // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaaccff); // Sky blue
        scene.fog = new THREE.FogExp2(0xaaccff, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 25, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.0);
        sunLight.position.set(30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        const d = 40;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // --- 3. ENVIRONMENT (ANIMATED SEA & ISLAND) ---
        // Sea Geometry segmented into vertices to allow for wave deformation
        const seaGeo = new THREE.PlaneGeometry(250, 250, 60, 60);
        const seaMat = new THREE.MeshStandardMaterial({ 
            color: 0x006699, 
            roughness: 0.15, 
            metalness: 0.1,
            flatShading: true // Gives waves a nice stylized low-poly look
        });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -0.1;
        sea.receiveShadow = true;
        scene.add(sea);

        // Save original Z positions of sea vertices for relative wave math
        const positionAttribute = seaGeo.attributes.position;
        const initialZ = [];
        for (let i = 0; i < positionAttribute.count; i++) {
            initialZ.push(positionAttribute.getZ(i));
        }

        // Island Base (Sand)
        const islandRadius = 20;
        const sandGeo = new THREE.CylinderGeometry(islandRadius, islandRadius + 2, 1, 32);
        const sandMat = new THREE.MeshStandardMaterial({ color: 0xe2c593, roughness: 0.9 });
        const sandBase = new THREE.Mesh(sandGeo, sandMat);
        sandBase.position.y = 0.1;
        sandBase.receiveShadow = true;
        scene.add(sandBase);

        // Island Greenery Top
        const greenGeo = new THREE.CylinderGeometry(islandRadius - 1, islandRadius, 0.8, 32);
        const greenMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8 });
        const greenTop = new THREE.Mesh(greenGeo, greenMat);
        greenTop.position.y = 0.6;
        greenTop.receiveShadow = true;
        scene.add(greenTop);

        // --- 4. MATERIAL HELPERS ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x993333, roughness: 0.7 });
        const solarMat = new THREE.MeshStandardMaterial({ color: 0x1a237e, roughness: 0.3, metalness: 0.6 });
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });

        function addSolarPanel(parentMesh, width, length, heightOffset) {
            const panelGeo = new THREE.BoxGeometry(width, 0.05, length);
            const panel = new THREE.Mesh(panelGeo, solarMat);
            panel.position.y = heightOffset + 0.03;
            panel.castShadow = true;
            parentMesh.add(panel);
        }

        // --- 5. STRUCTURES & ASSETS ---

        // Central School
        const schoolGroup = new THREE.Group();
        schoolGroup.position.set(0, 1, 0);
        
        const mainSchoolGeo = new THREE.BoxGeometry(5, 2.5, 3);
        const mainSchool = new THREE.Mesh(mainSchoolGeo, wallMat);
        mainSchool.castShadow = true; mainSchool.receiveShadow = true;
        schoolGroup.add(mainSchool);

        const schoolRoofGeo = new THREE.BoxGeometry(5.4, 0.3, 3.4);
        const schoolRoof = new THREE.Mesh(schoolRoofGeo, roofMat);
        schoolRoof.position.y = 1.4;
        schoolRoof.castShadow = true;
        schoolGroup.add(schoolRoof);
        addSolarPanel(schoolRoof, 4.5, 2.6, 0.15);

        scene.add(schoolGroup);

        // Greenhouse (Next to school)
        const ghGroup = new THREE.Group();
        ghGroup.position.set(5.5, 1, 0);
        const ghMat = new THREE.MeshStandardMaterial({ color: 0xaaeeff, transparent: true, opacity: 0.6, roughness: 0.1 });
        const ghGeo = new THREE.BoxGeometry(2.5, 1.8, 2);
        const gh = new THREE.Mesh(ghGeo, ghMat);
        gh.castShadow = true;
        ghGroup.add(gh);
        
        const plantGeo = new THREE.BoxGeometry(2, 0.8, 1.5);
        const plantMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
        const innerPlants = new THREE.Mesh(plantGeo, plantMat);
        innerPlants.position.y = -0.3;
        ghGroup.add(innerPlants);
        scene.add(ghGroup);

        // Dorms / Houses
        const dormPositions = [
            { x: -5, z: -4, rot: 0 },
            { x: -5, z: 0, rot: 0 },
            { x: -5, z: 4, rot: 0 }
        ];

        dormPositions.forEach(pos => {
            const dormGroup = new THREE.Group();
            dormGroup.position.set(pos.x, 1, pos.z);

            const houseGeo = new THREE.BoxGeometry(2, 1.8, 2);
            const house = new THREE.Mesh(houseGeo, wallMat);
            house.castShadow = true; house.receiveShadow = true;
            dormGroup.add(house);

            const roofGeo = new THREE.ConeGeometry(1.6, 1, 4);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 1.4;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            dormGroup.add(roof);

            const panelGeo = new THREE.BoxGeometry(0.8, 0.05, 0.8);
            const panel = new THREE.Mesh(panelGeo, solarMat);
            panel.position.set(0, 1.4, 0.4);
            panel.rotation.x = 0.5;
            dormGroup.add(panel);

            scene.add(dormGroup);
        });

        // Roads
        const road1Geo = new THREE.PlaneGeometry(2, 25);
        const road1 = new THREE.Mesh(road1Geo, roadMat);
        road1.rotation.x = -Math.PI / 2;
        road1.position.set(-1.5, 1.01, 0);
        road1.receiveShadow = true;
        scene.add(road1);

        const road2Geo = new THREE.PlaneGeometry(15, 2);
        const road2 = new THREE.Mesh(road2Geo, roadMat);
        road2.rotation.x = -Math.PI / 2;
        road2.position.set(-2, 1.01, -2.5);
        road2.receiveShadow = true;
        scene.add(road2);

        // Small Farms
        const farmMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 1.0 });
        const cropMat = new THREE.MeshStandardMaterial({ color: 0x7cb342 });
        const farmPositions = [
            { x: 4, z: -6 },
            { x: 8, z: -5 },
            { x: 6, z: 6 }
        ];

        farmPositions.forEach(pos => {
            const farmGroup = new THREE.Group();
            farmGroup.position.set(pos.x, 1.01, pos.z);

            const plotGeo = new THREE.PlaneGeometry(3, 3);
            const plot = new THREE.Mesh(plotGeo, farmMat);
            plot.rotation.x = -Math.PI / 2;
            plot.receiveShadow = true;
            farmGroup.add(plot);

            for(let i = -1; i <= 1; i += 0.5) {
                const cropGeo = new THREE.BoxGeometry(0.2, 0.2, 2.6);
                const cropRow = new THREE.Mesh(cropGeo, cropMat);
                cropRow.position.set(i, 0.1, 0);
                cropRow.castShadow = true;
                farmGroup.add(cropRow);
            }
            scene.add(farmGroup);
        });

        // Port
        const portGroup = new THREE.Group();
        portGroup.position.set(0, 0.5, 19);

        const pierMat = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.9 });
        const pierGeo = new THREE.BoxGeometry(3, 0.4, 6);
        const pier = new THREE.Mesh(pierGeo, pierMat);
        pier.position.z = 1;
        pier.castShadow = true; pier.receiveShadow = true;
        portGroup.add(pier);

        const boxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xd84315 });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(0.7, 0.6, 0);
        box.castShadow = true;
        portGroup.add(box);

        scene.add(portGroup);

        // --- 6. MANGROVE TREES ---
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.9 });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.8 });

        function createMangroveTree() {
            const tree = new THREE.Group();
            
            const trunkGeo = new THREE.CylinderGeometry(0.15, 0.3, 1.5, 5);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            tree.add(trunk);

            for (let i = 0; i < 3; i++) {
                const rootGeo = new THREE.CylinderGeometry(0.08, 0.15, 0.8, 4);
                const root = new THREE.Mesh(rootGeo, trunkMat);
                root.position.set(Math.sin(i * 2) * 0.3, 0.3, Math.cos(i * 2) * 0.3);
                root.rotation.z = 0.4;
                root.rotation.y = i;
                tree.add(root);
            }

            const leavesGeo = new THREE.SphereGeometry(0.9, 8, 8);
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 1.7;
            leaves.scale.set(1.2, 1, 1.2);
            leaves.castShadow = true;
            tree.add(leaves);

            return tree;
        }

        const totalTrees = 45;
        for (let i = 0; i < totalTrees; i++) {
            const angle = (i / totalTrees) * Math.PI * 2;
            const radiusOffset = islandRadius - 0.5; 
            const x = Math.sin(angle) * radiusOffset;
            const z = Math.cos(angle) * radiusOffset;

            if (z > 16 && Math.abs(x) < 5) continue; // Skip port area

            const mangrove = createMangroveTree();
            mangrove.position.set(x, 0.3, z);
            
            const s = 0.7 + Math.random() * 0.5;
            mangrove.scale.set(s, s, s);
            mangrove.rotation.y = Math.random() * Math.PI;

            scene.add(mangrove);
        }

        // --- 7. WINDMILL ---
        const windmillGroup = new THREE.Group();
        windmillGroup.position.set(22, 0, -15);

        const towerGeo = new THREE.CylinderGeometry(0.3, 0.7, 10, 8);
        const towerMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 });
        const tower = new THREE.Mesh(towerGeo, towerMat);
        tower.position.y = 5;
        tower.castShadow = true; tower.receiveShadow = true;
        windmillGroup.add(tower);

        const nacelleGeo = new THREE.BoxGeometry(0.6, 0.6, 1.2);
        const nacelle = new THREE.Mesh(nacelleGeo, towerMat);
        nacelle.position.set(0, 10, 0);
        nacelle.castShadow = true;
        windmillGroup.add(nacelle);

        const bladeGroup = new THREE.Group();
        bladeGroup.position.set(0, 10, 0.7);

        const hubGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const hubMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const hub = new THREE.Mesh(hubGeo, hubMat);
        hub.rotation.x = Math.PI / 2;
        bladeGroup.add(hub);

        for (let i = 0; i < 3; i++) {
            const bladeGeo = new THREE.BoxGeometry(0.2, 4, 0.05);
            const blade = new THREE.Mesh(bladeGeo, towerMat);
            blade.position.y = 2;
            
            const pivot = new THREE.Group();
            pivot.rotation.z = (i * Math.PI * 2) / 3;
            pivot.add(blade);
            bladeGroup.add(pivot);
        }
        windmillGroup.add(bladeGroup);
        scene.add(windmillGroup);

        // --- 8. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // 1. Windmill rotation
            bladeGroup.rotation.z = elapsed * 1.5; 

            // 2. Dynamic Wave Generation Math
            const posAttr = seaGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i); // Note: PlaneGeometry default uses Y for height mapping before rotation

                // Combine multiple sine/cosine waves to mimic natural ocean surface turbulence
                const wave1 = Math.sin(x * 0.1 + elapsed * 1.2) * 0.25;
                const wave2 = Math.cos(y * 0.08 + elapsed * 1.0) * 0.25;
                const wave3 = Math.sin((x + y) * 0.05 + elapsed * 0.5) * 0.15;

                // Update vertex height (Z axis in PlaneGeometry coordinate frame)
                posAttr.setZ(i, initialZ[i] + wave1 + wave2 + wave3);
            }
            // Alert Three.js that vertices have shifted to update the frame
            posAttr.needsUpdate = true;
            seaGeo.computeVertexNormals(); 

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 9. WINDOW RESIZE ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
</html>
